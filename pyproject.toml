[project]
name = "amr-graphon-control-v6"
version = "6.0.0"
description = "Observation-driven hybrid Graphon control with executable differential-drive safety"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "pillow>=10,<13",
    "threadpoolctl>=3.6.0",
    "editables>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/amr_control"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
amr-v6 = "amr_control.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

